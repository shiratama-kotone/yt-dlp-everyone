<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube ダウンローダー (個人用)</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #8a8f98;
    --accent: #4f8cff;
    --accent-hover: #3d75e0;
    --danger: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .container { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #10131a;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .video-info { display: flex; gap: 12px; margin-bottom: 4px; }
  .video-info img { width: 120px; border-radius: 6px; }
  .video-meta { font-size: 13px; color: var(--muted); }
  .video-meta .title { color: var(--text); font-size: 15px; margin-bottom: 4px; }
  .status { font-size: 13px; margin-top: 8px; }
  .status.error { color: var(--danger); }
  .status.ok { color: #6be08a; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; margin-bottom: 12px; }

  .options { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #10131a;
    cursor: pointer;
  }
  .option.selected { border-color: var(--accent); background: #16223d; }
  .option .label { font-size: 15px; }
  .option .size { font-size: 13px; color: var(--muted); }
  .option input[type=radio] { margin-right: 10px; }
</style>
</head>
<body>
<div class="container">
  <h1>YouTube ダウンローダー</h1>
  <div class="sub">個人利用専用サーバー / MP4固定・音声は自動で付きます</div>

  <div class="panel">
    <label for="apiKey">APIキー(サーバー側で API_KEY を設定している場合のみ入力)</label>
    <input type="password" id="apiKey" placeholder="任意">

    <label for="url">YouTube 動画URL</label>
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=...">

    <button id="fetchBtn">サイズを取得</button>
    <div id="fetchStatus" class="status"></div>
  </div>

  <div class="panel" id="resultPanel" style="display:none;">
    <div class="video-info">
      <img id="thumb" src="" alt="">
      <div class="video-meta">
        <div class="title" id="videoTitle"></div>
        <div id="videoChannel"></div>
        <div id="videoDuration"></div>
      </div>
    </div>

    <div class="hint">画質(サイズ)を選んでダウンロードしてください。音声は自動で結合され、MP4で保存されます。</div>

    <div class="options" id="optionsList"></div>

    <button id="downloadBtn" disabled>ダウンロード開始</button>
    <div id="downloadStatus" class="status"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// APIキーはブラウザに保存しておく(個人用途のため簡易実装)
$('apiKey').value = localStorage.getItem('ytdl_api_key') || '';
$('apiKey').addEventListener('change', () => {
  localStorage.setItem('ytdl_api_key', $('apiKey').value);
});

function authHeaders() {
  const key = $('apiKey').value.trim();
  return key ? { 'x-api-key': key } : {};
}

function formatDuration(sec) {
  if (!sec) return '';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function formatSize(mb) {
  if (!mb) return '推定サイズ不明';
  return mb >= 1024 ? `約 ${(mb / 1024).toFixed(2)} GB` : `約 ${mb.toFixed(1)} MB`;
}

let selectedOption = null;

$('fetchBtn').addEventListener('click', async () => {
  const url = $('url').value.trim();
  const statusEl = $('fetchStatus');
  statusEl.className = 'status';
  statusEl.textContent = '';
  selectedOption = null;
  $('downloadBtn').disabled = true;

  if (!url) {
    statusEl.className = 'status error';
    statusEl.textContent = 'URLを入力してください';
    return;
  }

  $('fetchBtn').disabled = true;
  statusEl.textContent = '取得中...(少し時間がかかることがあります)';

  try {
    const res = await fetch(`/api/formats?url=${encodeURIComponent(url)}`, {
      headers: authHeaders(),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '取得に失敗しました');

    $('videoTitle').textContent = data.title || '(タイトル不明)';
    $('videoChannel').textContent = data.channel || '';
    $('videoDuration').textContent = formatDuration(data.duration);
    $('thumb').src = data.thumbnail || '';

    const optionsList = $('optionsList');
    optionsList.innerHTML = '';

    const options = data.simpleOptions || [];
    if (options.length === 0) {
      optionsList.innerHTML = '<div class="hint">選択可能な画質が見つかりませんでした</div>';
    }

    options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = `
        <span class="label"><input type="radio" name="quality" ${i === 0 ? 'checked' : ''}> ${opt.label}</span>
        <span class="size">${formatSize(opt.estimatedSizeMB)}</span>
      `;
      div.addEventListener('click', () => {
        document.querySelectorAll('.option').forEach((el) => el.classList.remove('selected'));
        div.classList.add('selected');
        div.querySelector('input[type=radio]').checked = true;
        selectedOption = opt;
        $('downloadBtn').disabled = false;
      });
      optionsList.appendChild(div);

      if (i === 0) {
        div.classList.add('selected');
        selectedOption = opt;
        $('downloadBtn').disabled = false;
      }
    });

    $('resultPanel').style.display = 'block';
    statusEl.className = 'status ok';
    statusEl.textContent = '取得完了';
  } catch (e) {
    statusEl.className = 'status error';
    statusEl.textContent = e.message;
  } finally {
    $('fetchBtn').disabled = false;
  }
});

$('downloadBtn').addEventListener('click', () => {
  const url = $('url').value.trim();
  const statusEl = $('downloadStatus');

  if (!url || !selectedOption) {
    statusEl.className = 'status error';
    statusEl.textContent = '画質を選択してください';
    return;
  }

  const params = new URLSearchParams({ url, formatId: selectedOption.formatId });
  if (selectedOption.audioFormatId) params.set('audioFormatId', selectedOption.audioFormatId);
  const key = $('apiKey').value.trim();
  if (key) params.set('apiKey', key);

  statusEl.className = 'status';
  statusEl.textContent = 'ダウンロードを開始しました(完了までブラウザの表示に従ってください)';

  // サーバーが直接ファイルを返すため、リンク遷移でブラウザのダウンロード機能を利用する
  window.location.href = `/api/download?${params.toString()}`;
});
</script>
</body>
</html>
